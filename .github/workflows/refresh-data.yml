# Refresh the real market prices every day and redeploy, so the live site
# follows the current market instead of a one-off snapshot.
name: Refresh real market data

on:
  schedule:
    - cron: "0 6 * * *"      # every day at 06:00 UTC
  workflow_dispatch:          # ...or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the latest prices
        run: python engine/fetch_markets.py
      - name: Rebuild the page
        run: python engine/build_page.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "VMFAmaker"
          git config user.email "VMFAmaker@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Prices unchanged, nothing to do."
          else
            git commit -m "Auto refresh real market data"
            git push
          fi
