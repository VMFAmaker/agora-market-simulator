    b2 += '<span class="lbl" style="margin-left:6px">Candles</span><div class="seg" id="candleSeg">' + button('c', 'auto', 'Auto', candlePick === 'auto') +
      levels.map((l) => button('c', l[0], l[0], candlePick === l[0])).join('') + '</div><span class="lbl" id="candleInfo"></span>';
    b2 += '<div class="seg" id="modeSeg">' + button('mode', 'candle', 'Candles', mode === 'candle') + button('mode', 'line', 'Line', mode === 'line') + '</div>';
    b2 += '<div class="seg" id="scaleSeg">' + button('sc', 'lin', 'Linear', !logScale) + button('sc', 'log', 'Log', logScale) + '</div>';
    if (source === 'real') b2 += '<button class="btn' + (replay.on ? ' on' : '') + '" id="replayBtn" title="step through the past with the future hidden">&#9202; Replay</button>';
    el('bar1').innerHTML = b1; el('bar2').innerHTML = b2;
    wireBars();
  }
  function wireBars() {
    if (source === 'sim') {
      el('playBtn').onclick = () => { playing = !playing; buildBars(); };
      el('liveBtn').onclick = () => { follow = true; pinRight(); buildBars(); draw(); };
      el('newBtn').onclick = () => { newSim(); if (view === 'tester') scheduleRun(0); fillSide(); draw(); };
      pick('speedSeg', 'sp', (v) => { speed = +v; });
      pick('scenSeg', 'scen', (v) => { scen = v; newSim(); if (view === 'tester') scheduleRun(0); fillSide(); draw(); });
    } else {
      const ms = el('mktSel'); if (ms) ms.onchange = function () { loadMarket(this.value, realFreq); };
      pick('freqSeg', 'freq', (v) => { candlePick = 'auto'; loadMarket(realSym, v); });
    }
    pick('viewSeg', 'view', (v) => setView(v));
    pick('zoomSeg', 'z', (v) => { if (!S) return; +v ? showLast(+v) : fitAll(); });
    el('zIn').onclick = () => S && zoomAt(0.7, follow ? 1 : 0.5);
    el('zOut').onclick = () => S && zoomAt(1.4, follow ? 1 : 0.5);
    pick('candleSeg', 'c', (v) => { candlePick = v; draw(); });
    pick('modeSeg', 'mode', (v) => { mode = v; draw(); });
    pick('scaleSeg', 'sc', (v) => { logScale = v === 'log'; draw(); });
    const rb = el('replayBtn'); if (rb) rb.onclick = () => { if (!S) return; replay.on ? stopReplay() : startReplay(); };
  }
  function setView(v) {
    view = v;
    el('testerCard').classList.toggle('hidden', view !== 'tester');
    el('resultsCard').classList.toggle('hidden', view !== 'tester');
    if (view === 'tester') { buildTester(); scheduleRun(0); }
    buildBars(); fillSide(); draw();
  }

  // ================================ THE STRATEGY TESTER ================================
  // Step 1 the strategy, step 2 the market and period, step 3 the method and the
  // execution assumptions. Any change re-runs the test.
  const isDaily = () => source === 'real' && realFreq === '1d';
  function field(label, input) { return '<div class="f"><span>' + label + '</span>' + input + '</div>'; }
  const numIn = (key, val, min, max, step, w) => '<input type="number" data-t="' + key + '" value="' + val + '" min="' + min + '" max="' + max + '" step="' + step + '"' + (w ? ' style="width:' + w + 'px"' : '') + '>';
  const check = (key, on, label) => '<label><input type="checkbox" data-t="' + key + '"' + (on ? ' checked' : '') + '> ' + label + '</label>';
  function resetStrategyDefaults() {
    const S_ = E.BY_KEY[T.strategy]; T.params = {};
    S_.settings.forEach((s) => { T.params[s[0]] = s[2]; });
    T.stop = 0; T.target = Math.round((S_.defaultTakeProfit || 0) * 100);
  }
  function buildTester() {
    if (!Object.keys(T.params).length && E.BY_KEY[T.strategy].settings.length) resetStrategyDefaults();
    const St = E.BY_KEY[T.strategy];
    // step 1
    let s1 = '<h4>Step 1 · Strategy</h4><select id="tStrategy" style="width:100%">' +
      E.STRATEGIES.map((x) => '<option value="' + x.key + '"' + (x.key === T.strategy ? ' selected' : '') + '>' + x.label + '</option>').join('') + '</select>' +
      '<div class="about">' + esc(St.about) + '</div>';
    St.settings.forEach((s) => {
      const isPct = s[5] < 1 && s[2] < 1;
      s1 += field(s[1] + (isPct ? ' %' : ''), '<input type="number" data-p="' + s[0] + '"' + (isPct ? ' data-pct="1"' : '') + ' value="' +
        (isPct ? +(T.params[s[0]] * 100).toFixed(2) : T.params[s[0]]) + '" min="' + (isPct ? s[3] * 100 : s[3]) + '" max="' + (isPct ? s[4] * 100 : s[4]) +
        '" step="' + (isPct ? +(s[5] * 100).toFixed(2) : s[5]) + '">');
    });
    s1 += field('stop loss %', numIn('stop', T.stop, 0, 50, 0.5)) + field('take profit %', numIn('target', T.target, 0, 200, 1));
    s1 += '<div class="sub"><span class="lbl">Position sizing</span>' +
      field('<select data-t="sizingKind"><option value="percent"' + (T.sizingKind === 'percent' ? ' selected' : '') + '>% of the account</option>' +
        '<option value="amount"' + (T.sizingKind === 'amount' ? ' selected' : '') + '>fixed amount</option>' +
        '<option value="volatility"' + (T.sizingKind === 'volatility' ? ' selected' : '') + '>% risked (volatility)</option></select>',
        numIn('sizingValue', T.sizingValue, 0, 1000000, T.sizingKind === 'amount' ? 1000 : 0.5, 90)) +
      field('max leverage', numIn('leverage', T.leverage, 1, 4, 0.5)) + field('', check('allowShort', T.allowShort, 'allow short selling')) + '</div>';
    // step 2
    let s2 = '<h4>Step 2 · Market</h4>';
    if (source === 'real') {
      const freqName = {'1d': 'daily', '1h': 'hourly', '1m': '1 minute'}[realFreq];
      s2 += field('Asset', '<b>' + esc(realMeta.name) + '</b>') + field('Data', freqName + ' (change it above the chart)');
      const auto = !realMeta.is_index && realMeta.benchmark ? 'Auto, ' + (IDX_NAME[realMeta.benchmark] || realMeta.benchmark) : 'Auto, none';
      s2 += field('Benchmark', isDaily() ? '<select data-t="bench"><option value="auto">' + esc(auto) + '</option>' +
        (CATALOGUE.indices || []).map((x) => '<option value="' + x.symbol + '"' + (T.bench === x.symbol ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') +
        '<option value="none"' + (T.bench === 'none' ? ' selected' : '') + '>None</option></select>' : '<span class="muted">daily data only</span>');
      const first = S ? S.base[0].d.slice(0, 10) : '', last = S ? S.base[S.base.length - 1].d.slice(0, 10) : '';
      s2 += '<div class="sub"><span class="lbl">Period</span>' +
        field('from', '<input type="date" data-t="start" value="' + (T.start || first) + '" min="' + first + '" max="' + last + '">') +
        field('to', '<input type="date" data-t="end" value="' + (T.end || last) + '" min="' + first + '" max="' + last + '">') +
        '<div class="f"><span></span><span class="pair"><button class="btn" id="perAll">Whole history</button><button class="btn" id="perView">What is on screen</button></span></div></div>';
    } else {
      s2 += field('Asset', '<b>AGX, the simulated market</b>') + field('Data', '1 minute bars, up to now') + field('Benchmark', '<span class="muted">none</span>');
    }
    s2 += '<div class="sub">' + field('Starting cash', numIn('cash', T.cash, 1000, 100000000, 1000, 110)) +
      field('', check('dividends', T.dividends, 'pay dividends as cash')) + '</div>';
    // step 3
    let s3 = '<h4>Step 3 · Method and execution</h4><div class="seg blue" id="methodSeg" style="width:100%">' +
      [['backtest', 'Backtest'], ['out_of_sample', 'Out-of-sample'], ['walk_forward', 'Walk-forward'], ['stress', 'Stress']]
        .map((m) => button('m', m[0], m[1], T.method === m[0])).join('') + '</div><div style="margin-top:8px">';
    if (T.method === 'out_of_sample') s3 += field('train on the first', numIn('split', T.split, 30, 90, 5) + ' %');
    if (T.method === 'walk_forward') s3 += isDaily() ? field('train years', numIn('trainYears', T.trainYears, 1, 8, 1)) + field('test years', numIn('testYears', T.testYears, 0.5, 4, 0.5))
      : field('train bars', numIn('trainBars', T.trainBars, 50, 5000, 50)) + field('test bars', numIn('testBars', T.testBars, 20, 2000, 10));
    if (T.method === 'out_of_sample' || T.method === 'walk_forward') s3 += field('choose settings by', '<select data-t="objective">' +
      [['sharpe', 'best Sharpe'], ['cagr', 'best return'], ['calmar', 'best Calmar']].map((o) => '<option value="' + o[0] + '"' + (T.objective === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>');
    if (T.method === 'stress') s3 += field('runs per scenario', numIn('seeds', T.seeds, 1, 8, 1));
    s3 += '</div><div class="sub"><span class="lbl">Execution</span>' +
      field('fill at', '<div class="seg" id="fillSeg">' + button('fa', 'next_open', 'Next open', T.fillAt === 'next_open') +
        button('fa', 'close', 'Same close', T.fillAt === 'close', 'optimistic, it assumes you could trade at a price you had not seen yet') + '</div>') +
      field('commission % (min)', '<span class="pair">' + numIn('commissionPct', T.commissionPct, 0, 2, 0.01, 64) + numIn('commissionMin', T.commissionMin, 0, 50, 0.5, 56) + '</span>') +
      field('spread, bps', numIn('spread', T.spread, 0, 200, 1)) +
      field('slippage', '<div class="seg" id="slipSeg">' + E.SLIPPAGE_PRESETS.map((b) => button('sl', b, (b / 100).toFixed(2) + '%', T.slippage === b)).join('') + '</div>') +
      field('max % of volume', numIn('participation', T.participation, 1, 100, 1)) +
      field('', check('impact', T.impact, 'market impact (square root rule)')) + '</div>';
    el('steps').innerHTML = '<div class="step">' + s1 + '</div><div class="step">' + s2 + '</div><div class="step">' + s3 + '</div>';
    wireTester();
  }
  function wireTester() {
    const box = el('steps');
    el('tStrategy').onchange = function () { T.strategy = this.value; resetStrategyDefaults(); paramMap = null; buildTester(); scheduleRun(0); };
    box.querySelectorAll('[data-p]').forEach((inp) => { inp.oninput = () => { const v = +inp.value; if (!isFinite(v)) return;
      T.params[inp.dataset.p] = inp.dataset.pct ? v / 100 : v; paramMap = null; scheduleRun(); }; });
    box.querySelectorAll('[data-t]').forEach((inp) => {
      const key = inp.dataset.t;
      const handler = () => {
        let v = inp.type === 'checkbox' ? inp.checked : inp.type === 'number' ? +inp.value : inp.value;
        if (inp.type === 'number' && !isFinite(v)) return;
        T[key] = v;
        if (key === 'sizingKind') { T.sizingValue = v === 'percent' ? 100 : v === 'amount' ? 10000 : 1; buildTester(); }
        paramMap = null; scheduleRun();
      };
      inp.oninput = handler; inp.onchange = handler;
    });
    pick('methodSeg', 'm', (v) => { T.method = v; tab = v === 'backtest' ? 'summary' : 'method'; buildTester(); scheduleRun(0); });
    pick('fillSeg', 'fa', (v) => { T.fillAt = v; scheduleRun(); });
    pick('slipSeg', 'sl', (v) => { T.slippage = +v; scheduleRun(); });
    const pa = el('perAll'); if (pa) pa.onclick = () => { T.start = ''; T.end = ''; buildTester(); scheduleRun(0); };
    const pv = el('perView'); if (pv) pv.onclick = () => { const av = avail();
      T.start = S.base[clamp(Math.ceil(V.a), 0, av - 1)].d.slice(0, 10); T.end = S.base[clamp(Math.floor(V.b), 0, av - 1)].d.slice(0, 10); buildTester(); scheduleRun(0); };
  }
  function dataKey() { return source + ':' + (source === 'real' ? realSym + ':' + realFreq : scen + ':' + (sim ? sim.candles[5].c : 0)); }
  function testMarket() {
    if (source === 'real') return realMarket;
    return {symbol: 'AGX', name: 'Simulated market', bars: S.base.slice(0, avail()), interval: '1m', periodsPerYear: 252 * 390,
      dividends: {}, fractional: false, benchmark: null};
  }
  function benchSymbol() {
    if (!isDaily()) return null;
    if (T.bench === 'none') return null;
    if (T.bench === 'auto') return !realMeta.is_index && realMeta.benchmark ? realMeta.benchmark : null;
    return T.bench === realSym ? null : T.bench;
  }
  function scheduleRun(delay, soft) {
    if (view !== 'tester') return;
    if (soft && runTimer) return;                        // a run is already on its way
    clearTimeout(runTimer);
    el('tStatus').textContent = 'Running…';
    runTimer = setTimeout(runTester, delay === undefined ? 220 : delay);
  }
  async function runTester() {
    runTimer = null;
    if (!S || view !== 'tester') return;
    const key = dataKey(), bSym = benchSymbol();
    let bench = null;
    if (bSym) { try { bench = E.marketFromFile(await loadFile(bSym, '1d'), META[bSym]); } catch (e) { bench = null; } }
    if (key !== dataKey()) return;                       // the market changed while we waited
    const sz = T.sizingKind === 'amount' ? T.sizingValue : T.sizingValue / 100;
    const cfg = E.defaultConfig({cash: T.cash, sizing: E.makeSizing(T.sizingKind, sz), allow_short: T.allowShort, max_leverage: T.leverage,
      dividends: T.dividends, execution: E.makeExecution({commission_pct: T.commissionPct / 100, commission_min: T.commissionMin,
        spread_bps: T.spread, slippage_bps: T.slippage, impact: T.impact, max_participation: T.participation / 100, fill_at: T.fillAt})});
    let end = source === 'real' && T.end ? T.end : null;
    if (source === 'real' && replay.on) { const f = S.base[replay.F].d; if (!end || f < end) end = f; }   // never past the frontier
    const params = Object.assign({}, T.params, {stop_loss: T.stop / 100, take_profit: T.target / 100});
    const exp = {strategy: T.strategy, params: params, markets: [testMarket()], bench: bench,
      start: source === 'real' && T.start ? T.start : null, end: end, config: cfg, method: T.method, split: T.split / 100,
      train_years: T.trainYears, test_years: T.testYears, train_bars: isDaily() ? null : T.trainBars, test_bars: isDaily() ? null : T.testBars,
      objective: T.objective, seeds: Array.from({length: T.seeds}, (_, i) => i + 1)};
    const t0 = performance.now();
    try {
      result = E.runExperiment(exp);
      R = result.method === 'stress' ? null : mapResult(result, key, bench);
      el('tStatus').textContent = result.label + ', ran in ' + Math.round(performance.now() - t0) + ' ms' +
        (replay.on ? ', using data up to ' + S.base[replay.F].d : source === 'sim' ? ', using the market up to now' : '');
    } catch (e) {
      result = null; R = null;
      el('tStatus').textContent = 'Could not run this test: ' + e.message;
    }
    lastRunAvail = avail(); lastRunAt = performance.now();
    renderResults(); fillSide(); updateReplayReadout(); draw();
  }
  function mapResult(res, key, bench) {
    const m = res.main, at = (t) => (t in S.idx ? S.idx[t] : null);
    const eqIdx = m.times.map(at);
    const out = {key: key, eqIdx: eqIdx, eqPct: m.equity.map((e) => e / m.equity[0] - 1), qty: m.qty,
      bench: m.benchmark_curve ? m.benchmark_curve.map((b) => b / m.benchmark_curve[0] - 1) : null, benchName: bench ? bench.name : '',
      fills: m.fills.map((f) => Object.assign({bi: at(f.time)}, f)), period: [eqIdx[0], eqIdx[eqIdx.length - 1]]};
    if (res.buy_hold && res.buy_hold.times && !(res.method === 'backtest' && T.strategy === 'bh')) {
      const e0 = res.buy_hold.equity[0];
      out.bh = {idx: res.buy_hold.times.map(at), pct: res.buy_hold.equity.map((e) => e / e0 - 1)};
    }
    if (res.method === 'out_of_sample') { out.train = [at(res.train.start), at(res.train.end)]; out.test = [at(res.test.start), at(res.test.end)]; }
    if (res.method === 'walk_forward') out.folds = res.folds.map((f) => [at(f.test[0]), at(f.test[1])]);
    return out;
  }

  // ================================ RESULTS ================================
  const tooShort = (m) => !(m.years >= 0.25);          // under about three months, yearly ratios mean nothing
  function tile(k, v, c, s) { return '<div class="tile"><div class="k">' + k + '</div><div class="v ' + (c || '') + '">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>'; }
  function renderResults() {
    if (!result) { el('banner').innerHTML = '<span class="muted">' + esc(el('tStatus').textContent) + '</span>'; el('tiles').innerHTML = ''; el('tabs').innerHTML = ''; el('tabbody').innerHTML = ''; return; }
    const m = result.main.metrics, daily = isDaily(), bh = result.buy_hold ? result.buy_hold.metrics : null;
    let banner = '<b>' + esc(result.label).toUpperCase() + '</b> · ' + esc(result.warning);
    if (result.method === 'out_of_sample') banner += '<br>Trained ' + result.train.start + ' to ' + result.train.end + ', tested ' + result.test.start + ' to ' + result.test.end +
      '. Chosen settings: ' + esc(settingsText(result.chosen)) + '.';
    if (result.method === 'walk_forward') banner += '<br>' + result.folds.length + ' test windows from ' + result.folds[0].test[0] + ' to ' + result.folds[result.folds.length - 1].test[1] + '.';
    if (R && R.bench && benchSymbol() && benchSymbol() !== '^SP500TR' && T.dividends) banner += '<br><span class="warn">Note.</span> The benchmark is a price index, so it leaves dividends out (roughly 1 to 2% a year), while the strategy collects them. Pick S&amp;P 500 Total Return for a like for like yardstick.';
    el('banner').innerHTML = banner;
    let tiles = '';
    if (result.method === 'stress') {
      const rows = result.scenarios, avgS = rows.reduce((a, r) => a + r.return, 0) / rows.length, avgH = rows.reduce((a, r) => a + r.buy_hold_return, 0) / rows.length;
      const worst = rows.reduce((a, r) => (r.worst_return < a.worst_return ? r : a), rows[0]);
      tiles = tile('Average return', pct(avgS), cls(avgS), 'across ' + rows.length + ' markets') + tile('Buy and hold', pct(avgH), cls(avgH), 'same markets') +
        tile('Worst run', pct(worst.worst_return), cls(worst.worst_return), worst.scenario) +
        tile('Crash', pct(rows[1].return), cls(rows[1].return), 'hold ' + pct(rows[1].buy_hold_return)) +
        tile('Bear', pct(rows[3].return), cls(rows[3].return), 'hold ' + pct(rows[3].buy_hold_return)) +
        tile('Sideways', pct(rows[4].return), cls(rows[4].return), 'hold ' + pct(rows[4].buy_hold_return)) +
        tile('Avg drawdown', pctPlain(rows.reduce((a, r) => a + r.max_drawdown, 0) / rows.length), 'down') +
        tile('Avg trades', num(rows.reduce((a, r) => a + r.trades, 0) / rows.length, 0));
    } else {
      tiles += tile('Total return', pct(m.total_return), cls(m.total_return), money0(m.start_value) + ' to ' + money0(m.end_value));
      tiles += daily && !tooShort(m) ? tile('Per year (CAGR)', pct(m.cagr), cls(m.cagr), num(m.years, 1) + ' years') : tile('Time in market', pctPlain(m.time_in_market, 0), '', 'of the bars');
      tiles += tooShort(m) ? tile('Sharpe', '--', 'muted', 'too short to annualise')
        : tile('Sharpe', num(m.sharpe), m.sharpe >= 1 ? 'up' : m.sharpe < 0 ? 'down' : '', 'Sortino ' + num(m.sortino));
      tiles += tile('Worst drawdown', pctPlain(m.max_drawdown), 'down', tooShort(m) ? 'over ' + money0(result.main.equity.length) + ' bars' : 'Calmar ' + num(m.calmar));
      if (m.benchmark_return !== undefined) tiles += daily ? tile('vs ' + esc(m.benchmark), pct(m.excess_cagr), cls(m.excess_cagr), 'a year, index ' + pct(m.benchmark_cagr))
        : tile('vs ' + esc(m.benchmark), pct(m.excess_return), cls(m.excess_return), 'index ' + pct(m.benchmark_return));
      else tiles += tile('vs benchmark', '--', 'muted', 'no benchmark');
      if (bh) tiles += daily && !tooShort(bh) ? tile('Buy and hold', pct(bh.cagr), cls(bh.cagr), 'a year, Sharpe ' + num(bh.sharpe))
        : tile('Buy and hold', pct(bh.total_return), cls(bh.total_return), 'same period');
      tiles += tile('Round trips', m.trades + (m.open_trades ? '+' + m.open_trades : ''), '', 'won ' + pctPlain(m.win_rate, 0) + (isFinite(m.profit_factor) ? ', PF ' + num(m.profit_factor) : ''));
      tiles += tile('Costs paid', pctPlain(m.costs_pct), 'down', 'of the start, ' + money0(m.costs));
    }
    el('tiles').innerHTML = tiles;
    const tabs = result.method === 'stress' ? [['method', 'Scenarios']] :
      [['summary', 'Summary'], ['trades', 'Trades (' + result.main.fills.length + ')'], ['robust', 'Robustness'], ['method', methodTabName()]];
    if (!tabs.some((t) => t[0] === tab)) tab = tabs[0][0];
    el('tabs').innerHTML = tabs.map((t) => '<button data-tab="' + t[0] + '"' + (t[0] === tab ? ' class="on"' : '') + '>' + t[1] + '</button>').join('');
    el('tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) { tab = b.dataset.tab; renderResults(); } };
    ({summary: tabSummary, trades: tabTrades, robust: tabRobust, method: tabMethod})[tab]();
  }
  const methodTabName = () => ({backtest: 'Next step', out_of_sample: 'Train vs test', walk_forward: 'Walk-forward windows', stress: 'Scenarios'})[T.method];
  function settingsText(p) {
    const St = E.BY_KEY[T.strategy], labels = {stop_loss: 'stop loss', take_profit: 'take profit'};
    St.settings.forEach((s) => { labels[s[0]] = s[1]; });
    return Object.keys(p).filter((k) => !((k === 'stop_loss' || k === 'take_profit') && !p[k]))
      .map((k) => labels[k] + ' ' + (p[k] < 1 && p[k] > 0 && (k === 'stop_loss' || k === 'take_profit' || k === 'drop' || k === 'band' || k === 'threshold') ? pctPlain(p[k], 0) : p[k])).join(', ') || 'none';
  }
  function tabSummary() {
    const m = result.main.metrics, sym = source === 'real' ? curSym(realMeta.currency) : '$';
    const L2 = (rows) => '<div class="rows" style="padding:0">' + rows.join('') + '</div>';
    const left = [head('Return'), row('Start', sym + money0(m.start_value)), row('End', sym + money0(m.end_value)), row('Total return', pct(m.total_return), cls(m.total_return)),
      row('Per year (CAGR)', isDaily() && !tooShort(m) ? pct(m.cagr) : '<span class="muted">too short to annualise</span>'),
      row('Volatility (yearly)', tooShort(m) ? '<span class="muted">--</span>' : pctPlain(m.volatility)),
      row('Worst drawdown', pctPlain(m.max_drawdown), 'down'), row('Longest time under water', money0(m.longest_underwater_bars) + ' bars'),
      row('Sharpe / Sortino / Calmar', tooShort(m) ? '<span class="muted">too short to annualise</span>' : num(m.sharpe) + ' / ' + num(m.sortino) + ' / ' + num(m.calmar))];
    const mid = [head('Trading'), row('Round trips', m.trades + (m.open_trades ? ' plus ' + m.open_trades + ' open' : '')), row('Win rate', pctPlain(m.win_rate, 0)),
      row('Profit factor', isFinite(m.profit_factor) ? num(m.profit_factor) : 'no losing trades'), row('<span class="muted">Open positions count at their last price</span>', ''), row('Average trade', pct(m.avg_trade, 2), cls(m.avg_trade)),
      row('Average hold', num(m.avg_bars_held, 0) + ' bars'), row('Time in market', pctPlain(m.time_in_market, 0)), row('Average exposure', pctPlain(m.avg_exposure, 0)),
      row('Turnover', num(m.turnover, 1) + 'x a year')];
    const right = [head('Costs and income'), row('Commission', sym + money0(m.commission)), row('Spread', sym + money0(m.spread)), row('Slippage', sym + money0(m.slippage)),
      row('Market impact', sym + money0(m.impact)), row('All costs', sym + money0(m.costs) + ' (' + pctPlain(m.costs_pct) + ')', 'down'),
      row('Dividends received', sym + money0(m.dividends), 'up')];
    if (m.benchmark_return !== undefined) right.push(head('Against ' + esc(m.benchmark)), row('Index return', pct(m.benchmark_return)),
      row('Excess a year', pct(m.excess_cagr), cls(m.excess_cagr)), row('Beta / alpha', num(m.beta) + ' / ' + pct(m.alpha)),
      row('Information ratio', num(m.information_ratio)), row('Tracking error', pctPlain(m.tracking_error)));
    el('tabbody').innerHTML = '<p>Settings: ' + esc(settingsText(result.main.params)) + '. Sizing ' + esc(sizingText()) + '. ' + esc(execText()) + '.</p>' +
      '<div class="steps" style="border-radius:8px;overflow:hidden"><div class="step">' + L2(left) + '</div><div class="step">' + L2(mid) + '</div><div class="step">' + L2(right) + '</div></div>';
  }
  const sizingText = () => T.sizingKind === 'amount' ? money0(T.sizingValue) + ' per position' : T.sizingKind === 'volatility' ? 'risking ' + T.sizingValue + '% of the account per trade' : T.sizingValue + '% of the account';
  const execText = () => 'Filled at ' + (T.fillAt === 'next_open' ? 'the next open' : 'the same close (optimistic)') + ', spread ' + T.spread + ' bps, slippage ' +
    (T.slippage / 100).toFixed(2) + '%, commission ' + T.commissionPct + '% (min ' + T.commissionMin + ')' + (T.impact ? ', with market impact' : '');
  function tabTrades() {
    const f = result.main.fills, sym = source === 'real' ? curSym(realMeta.currency) : '$', trips = result.main.trips;
    const best = trips.reduce((a, t) => (!a || t.return > a.return ? t : a), null), worst = trips.reduce((a, t) => (!a || t.return < a.return ? t : a), null);
    let html = '<p>Every order, how it was filled, and what it cost. Click a row to jump the chart to it.' +
      (trips.length ? ' Best round trip ' + pct(best.return) + ' (' + best.entry_time + '), worst ' + pct(worst.return) + ' (' + worst.entry_time + ').' : '') + '</p>';
    const rows = f.slice(-400).reverse();
    html += '<div class="tablewrap"><table><tr><th class="l">Filled</th><th class="l">Order</th><th>Qty</th><th>Expected</th><th>Filled at</th><th>Fee</th><th>Spread</th><th>Slippage</th><th>Impact</th><th>% of volume</th><th class="l">Why</th></tr>' +
      rows.map((x) => '<tr class="click" data-time="' + x.time + '"><td class="l">' + x.time + '</td><td class="l ' + (x.side === 'buy' ? 'up' : 'down') + '">' + x.side.toUpperCase() +
        (x.purpose !== 'entry' ? ' <span class="muted">(' + x.purpose + ')</span>' : '') + '</td><td>' + (Math.abs(x.qty - Math.round(x.qty)) > 1e-6 ? num(x.qty, 4) : money0(x.qty)) + '</td><td>' + money2(x.expected) +
        '</td><td>' + money2(x.price) + '</td><td>' + money2(x.commission) + '</td><td>' + money2(x.spread_cost) + '</td><td>' + money2(x.slippage_cost) + '</td><td>' + money2(x.impact_cost) +
        '</td><td>' + (x.participation ? pctPlain(x.participation, 3) : '--') + '</td><td class="why">' + esc(x.reason) + (x.note ? ' <span class="warn">' + esc(x.note) + '</span>' : '') + '</td></tr>').join('') +
      '</table></div>' + (f.length > 400 ? '<p style="margin-top:8px">Showing the latest 400 of ' + f.length + ' fills.</p>' : '');
    const rejected = result.main.orders.filter((o) => o.status === 'rejected' || o.status === 'partial');
    if (rejected.length) html += '<p style="margin-top:10px">' + rejected.length + ' orders were cut down or turned away, usually for lack of cash or volume.</p>';
    el('tabbody').innerHTML = html;
    el('tabbody').querySelectorAll('tr[data-time]').forEach((tr) => { tr.onclick = () => { const i = S.idx[tr.dataset.time]; if (i != null) { showAround(i, Math.min(V.b - V.a, 180)); window.scrollTo({top: el('chartCard').offsetTop - 10, behavior: 'smooth'}); } }; });
  }
  function tabRobust() {
    const rb = result.robustness;
    let html = '<p>The same test under different execution assumptions, using your settings over the whole test period. If a small change in costs wipes out the result, the edge was never really there.</p>';
    html += '<div class="tablewrap" style="max-height:none"><table><tr><th class="l">Slippage</th><th>Per year</th><th>Sharpe</th><th>vs benchmark</th><th>Costs</th><th>Trades</th></tr>' +
      rb.costs.map((r) => '<tr' + (r.slippage_bps === T.slippage ? ' style="background:#18233a"' : '') + '><td class="l">' + (r.slippage_bps / 100).toFixed(2) + '%</td><td class="' + cls(r.cagr) + '">' + pct(r.cagr) +
        '</td><td>' + num(r.sharpe) + '</td><td class="' + cls(r.excess_cagr) + '">' + pct(r.excess_cagr) + '</td><td>' + pctPlain(r.costs_pct) + '</td><td>' + r.trades + '</td></tr>').join('') + '</table></div>';
    const nx = rb.fills[0], cl = rb.fills[1];
    html += '<p style="margin-top:14px">Fill timing. Filling at the next open is honest. Filling at the same close assumes you could trade at a price that only existed once the bar was over, which is a quiet form of look-ahead.</p>' +
      '<div class="tablewrap" style="max-height:none"><table><tr><th class="l">Filled at</th><th>Per year</th><th>Sharpe</th><th>Worst drawdown</th></tr>' +
      '<tr><td class="l">Next open (honest)</td><td class="' + cls(nx.cagr) + '">' + pct(nx.cagr) + '</td><td>' + num(nx.sharpe) + '</td><td>' + pctPlain(nx.max_drawdown) + '</td></tr>' +
      '<tr><td class="l">Same close (optimistic)</td><td class="' + cls(cl.cagr) + '">' + pct(cl.cagr) + '</td><td>' + num(cl.sharpe) + '</td><td>' + pctPlain(cl.max_drawdown) + '</td></tr></table></div>' +
      '<p style="margin-top:8px">' + (cl.cagr - nx.cagr > 0.002 ? 'The gap is ' + pct(cl.cagr - nx.cagr) + ' a year. That is how much a careless backtest would flatter this rule.' :
        'Here it makes little difference (' + pct(cl.cagr - nx.cagr) + ' a year), because this rule trades rarely and the overnight gap cuts both ways. Busy rules are hit much harder.') + '</p>';
    html += '<p style="margin-top:14px">Settings map. Every combination in the strategy’s grid over the whole period. A broad area of decent results is reassuring. One lonely peak is a warning sign of overfitting.</p>';
    html += paramMap ? paramMapHTML() : '<button class="btn" id="mapBtn">Map the settings</button>';
    el('tabbody').innerHTML = html;
    const mb = el('mapBtn'); if (mb) mb.onclick = () => { mb.textContent = 'Mapping…'; setTimeout(buildParamMap, 20); };
  }
  function buildParamMap() {
    const exp = lastExperiment();
    paramMap = E.parameterMap(exp);
    tabRobust();
  }
  function lastExperiment() {
    const sz = T.sizingKind === 'amount' ? T.sizingValue : T.sizingValue / 100;
    const cfg = E.defaultConfig({cash: T.cash, sizing: E.makeSizing(T.sizingKind, sz), allow_short: T.allowShort, max_leverage: T.leverage, dividends: T.dividends,
      execution: E.makeExecution({commission_pct: T.commissionPct / 100, commission_min: T.commissionMin, spread_bps: T.spread, slippage_bps: T.slippage,
        impact: T.impact, max_participation: T.participation / 100, fill_at: T.fillAt})});
    return {strategy: E.BY_KEY[T.strategy], params: Object.assign({}, T.params, {stop_loss: T.stop / 100, take_profit: T.target / 100}), markets: [testMarket()],
      bench: null, start: source === 'real' && T.start ? T.start : null, end: source === 'real' && T.end ? T.end : null, config: cfg};
  }
  function paramMapHTML() {
    const keys = Object.keys(E.BY_KEY[T.strategy].grid);
    if (keys.length === 2) {
      const [ka, kb] = keys, A = [...new Set(paramMap.map((r) => r.params[ka]))], Bv = [...new Set(paramMap.map((r) => r.params[kb]))];
      const vals = paramMap.map((r) => r.sharpe), lo = Math.min(...vals), hi = Math.max(...vals);
      const colour = (s) => { const t = (s - lo) / ((hi - lo) || 1); return 'rgba(' + Math.round(239 - 201 * t) + ',' + Math.round(83 + 83 * t) + ',' + Math.round(80 + 74 * t) + ',0.55)'; };
      let h = '<div class="tablewrap" style="max-height:none"><table class="heat"><tr><th class="l">' + ka + ' \\ ' + kb + '</th>' + Bv.map((b) => '<th>' + b + '</th>').join('') + '</tr>';
      for (const a of A) {
        h += '<tr><th class="l">' + a + '</th>' + Bv.map((b) => { const r = paramMap.find((x) => x.params[ka] === a && x.params[kb] === b);
          return r ? '<td style="background:' + colour(r.sharpe) + '" title="per year ' + pct(r.cagr) + ', worst drawdown ' + pctPlain(r.max_drawdown) + '">' + num(r.sharpe) + '</td>' : '<td class="muted">--</td>'; }).join('') + '</tr>';
      }
      return h + '</table></div><p style="margin-top:6px">Numbers are the Sharpe ratio. Hover a cell for the yearly return and worst drawdown.</p>';
    }
    return '<div class="tablewrap" style="max-height:none"><table><tr><th class="l">Settings</th><th>Per year</th><th>Sharpe</th><th>Worst drawdown</th></tr>' +
      paramMap.slice().sort((a, b) => b.sharpe - a.sharpe).map((r) => '<tr><td class="l">' + esc(settingsText(r.params)) + '</td><td class="' + cls(r.cagr) + '">' + pct(r.cagr) + '</td><td>' + num(r.sharpe) +
        '</td><td>' + pctPlain(r.max_drawdown) + '</td></tr>').join('') + '</table></div>';
  }
  function tabMethod() {
    let html = '';
    if (result.method === 'backtest') {
      html = '<p>A historical backtest runs the rule over the whole period with the settings you chose. It is a good way to understand a rule, but ' +
        'it is not evidence that it works, because you picked the settings while looking at this same history.</p><p>Try <b>Out-of-sample</b> to choose the settings on ' +
        'the early years and judge them on later ones, or <b>Walk-forward</b> to do that year after year. Try <b>Stress</b> to see how the rule copes with a crash, a bear market and a choppy one.</p>';
    } else if (result.method === 'out_of_sample') {
      const tr = result.train.metrics, te = result.main.metrics;
      html = '<p>The optimiser tried every setting in the grid on the training years and kept the best by ' + ({sharpe: 'Sharpe', cagr: 'return', calmar: 'Calmar'})[T.objective] +
        '. Those settings were then frozen and run on the test years, which it never saw.</p>' +
        '<div class="tablewrap" style="max-height:none"><table><tr><th class="l"></th><th>Period</th><th>Per year</th><th>Sharpe</th><th>Worst drawdown</th><th>Round trips</th></tr>' +
        '<tr><td class="l">Training (in sample)</td><td>' + result.train.start + ' to ' + result.train.end + '</td><td>' + pct(tr.cagr) + '</td><td>' + num(tr.sharpe) + '</td><td>' + pctPlain(tr.max_drawdown) + '</td><td>' + tr.trades + '</td></tr>' +
        '<tr><td class="l">Test (out of sample)</td><td>' + result.test.start + ' to ' + result.test.end + '</td><td class="' + cls(te.cagr) + '">' + pct(te.cagr) + '</td><td>' + num(te.sharpe) + '</td><td>' + pctPlain(te.max_drawdown) + '</td><td>' + te.trades + '</td></tr></table></div>' +
        '<p style="margin-top:10px">Sharpe went from ' + num(tr.sharpe) + ' to ' + num(te.sharpe) + '. ' + (result.degradation.sharpe < -0.3 ? 'A big drop like this usually means the settings fitted the past rather than found something lasting.' :
          result.degradation.sharpe < 0 ? 'Some drop is normal. The question is whether what is left still beats buying and holding.' : 'It held up on unseen data, which is encouraging, though one test window is still one test window.') + '</p>' +
        '<p>Best settings on the training years:</p><div class="tablewrap" style="max-height:none"><table><tr><th class="l">Settings</th><th>Per year</th><th>Sharpe</th><th>Round trips</th></tr>' +
        result.grid.slice(0, 6).map((r) => '<tr><td class="l">' + esc(settingsText(r.params)) + '</td><td>' + pct(r.cagr) + '</td><td>' + num(r.sharpe) + '</td><td>' + r.trades + '</td></tr>').join('') + '</table></div>';
    } else if (result.method === 'walk_forward') {
      const eff = result.efficiency, st = result.stability;
      html = '<p>Each window re-chooses the settings using only the years before it, then trades the next window with them frozen. Only the test windows count, joined into one record.</p>' +
        '<div class="tablewrap" style="max-height:none"><table><tr><th class="l">Trained on</th><th class="l">Tested on</th><th class="l">Settings chosen</th><th>Train, a year</th><th>Test return</th><th>Index</th><th>Test Sharpe</th><th>Trips</th></tr>' +
        result.folds.map((f) => '<tr><td class="l">' + f.train[0].slice(0, 10) + ' to ' + f.train[1].slice(0, 10) + '</td><td class="l">' + f.test[0].slice(0, 10) + ' to ' + f.test[1].slice(0, 10) +
          '</td><td class="l">' + esc(settingsText(f.params)) + '</td><td>' + pct(f.train_cagr) + '</td><td class="' + cls(f.test_return) + '">' + pct(f.test_return) + '</td><td>' +
          (f.benchmark_return == null ? '--' : pct(f.benchmark_return)) + '</td><td>' + num(f.test_sharpe) + '</td><td>' + f.trades + '</td></tr>').join('') + '</table></div>' +
        '<p style="margin-top:10px">Walk-forward efficiency ' + (eff == null ? '--' : num(eff)) + '. That is the return on unseen windows divided by the average return the optimiser found in training. ' +
        'Above about 0.5 is usually seen as healthy, near zero or below means most of the in-sample result was luck. The settings changed ' + (st.different_settings - 1) +
        ' times across ' + st.folds + ' windows. ' + (st.different_settings > st.folds / 2 ? 'That is a lot of changing, a sign the best settings are unstable.' : 'Fairly stable, which is a good sign.') + '</p>';
    } else {
      html = '<p>' + esc(result.warning) + ' Each scenario is run ' + T.seeds + ' times with different random draws.</p>' +
        '<div class="tablewrap" style="max-height:none"><table><tr><th class="l">Market</th><th class="l">What it is</th><th>Strategy</th><th>Worst run</th><th>Drawdown</th><th>Buy and hold</th><th>Hold drawdown</th><th>Trades</th></tr>' +
        result.scenarios.map((r) => '<tr><td class="l">' + r.scenario + '</td><td class="why">' + esc(r.about) + '</td><td class="' + cls(r.return) + '">' + pct(r.return) + '</td><td class="' + cls(r.worst_return) + '">' + pct(r.worst_return) +
          '</td><td>' + pctPlain(r.max_drawdown) + '</td><td class="' + cls(r.buy_hold_return) + '">' + pct(r.buy_hold_return) + '</td><td>' + pctPlain(r.buy_hold_drawdown) + '</td><td>' + num(r.trades, 0) + '</td></tr>').join('') +
        '</table></div><p style="margin-top:10px">Below, one crash run. Price on top, the strategy’s account underneath.</p><canvas class="mini" id="stressCv"></canvas>';
    }
    el('tabbody').innerHTML = html;
    if (result.method === 'stress') drawStressMini();
  }
  function drawStressMini() {
    const c = el('stressCv'); if (!c) return;
    const w = c.clientWidth, h = c.clientHeight, g = c.getContext('2d');
    c.width = w * dpr; c.height = h * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bars = result.market.bars, eq = result.main.equity, n = bars.length;
    const line = (vals, top, bot, col, off) => { let lo = Math.min(...vals), hi = Math.max(...vals); g.strokeStyle = col; g.lineWidth = 1.5; g.beginPath();
      vals.forEach((v, i) => { const x = 8 + (i + off) / (n - 1) * (w - 16), y = top + (bot - top) * (hi - v) / ((hi - lo) || 1); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); };
    line(bars.map((b) => b.c), 8, h * 0.5 - 6, withAlpha(TEXT, 0.7), 0);
    line(eq, h * 0.5 + 6, h - 8, ACCENT, n - eq.length);
  }

  // ================================ SWITCHING SOURCE ================================
  function switchSource(s) {
    source = s; replay.on = false; replay.playing = false; result = null; R = null; candlePick = 'auto'; paramMap = null;
    el('sourceSeg').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.src === s));
    updateReplayBar();
    if (source === 'sim') {
      el('sub').textContent = 'MARKET SIMULATOR';
      el('srcHint').textContent = 'A fresh, random market, different every time. It plays live, and New market makes another.';
      if (!sim) newSim(); else { S = buildSeries(sim.candles, '1m', 'sim'); follow = true; wantSpan = 150; pinRight(); }
      buildBars(); if (view === 'tester') { buildTester(); scheduleRun(0); } fillSide(); draw();
    } else {
      el('sub').textContent = 'REAL MARKETS';
      el('srcHint').textContent = 'Ten years of real prices for 29 companies and 6 indices, refreshed daily. Scroll through it all, or replay it bar by bar.';
      const first = ((CATALOGUE.securities || [])[0] || (CATALOGUE.indices || [])[0] || {}).symbol;
      S = null; loadMarket(realSym || first, realFreq);
    }
  }
  el('sourceSeg').onclick = (e) => { const b = e.target.closest('button'); if (b && b.dataset.src !== source) switchSource(b.dataset.src); };

  // ================================ THE CLOCK ================================
  function loop() {
    const now = performance.now();
    if (!lastTick) { lastTick = now; return; }
    const dt = Math.min(1, (now - lastTick) / 1000); lastTick = now;
    if (source === 'sim' && sim && playing) {
      const before = avail();
      nowMin += speed * dt; elapsed += speed * dt;
      if (nowMin >= sim.candles.length - 1) { nowMin = sim.candles.length - 1; playing = false; buildBars(); }
      if (avail() !== before) onFrontier(); else { if (follow) draw(); }
    }
    if (source === 'real' && replay.on && replay.playing) {
      replay.acc += dt * replay.speed;
      const k = Math.floor(replay.acc);
      if (k > 0) { replay.acc -= k; stepReplay(k); }
    }
  }

  // ================================ START ================================
  document.querySelectorAll('.side h3').forEach((h) => { h.onclick = () => el(h.dataset.card).classList.toggle('closed'); });
  const d = new Date(); clockStartSec = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
  el('foot').innerHTML = 'Agora · a made-up market next to real prices, with one backtest engine for both. Real prices are refreshed daily ' +
    '(catalogue built ' + CATALOGUE.built + '). This is not investment advice.';
  el('srcHint').textContent = 'A fresh, random market, different every time. It plays live, and New market makes another.';
  newSim(); buildBars(); fillSide();
  window.addEventListener('resize', resize); resize();
  setInterval(loop, 33);
})();
</script>
