<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora Market Simulator</title>
<!--
  The Agora dashboard.
  Two sources: a made-up SIMULATION and REAL market prices. The chart, the
  strategy tester and the side panels are shared by both. The backtest engine is
  backtest.js (the same engine as the Python research code), poured in by
  build_page.py. Coding done with the help of AI, because coding is not the
  author's strong area.
-->
<style>
  :root{--bg:#0e1420;--panel:#141d2e;--panel2:#101828;--line:#223049;--text:#c9d5e6;
    --muted:#7c8aa0;--up:#26a69a;--down:#ef5350;--accent:#2dd4bf;--grid:#1a2438;--bench:#60a5fa;--warn:#f59e0b;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
  .wrap{max-width:1360px;margin:0 auto;padding:18px}

  /* top bar */
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;
    gap:14px;border-bottom:1px solid var(--line);padding-bottom:14px}
  .brand h1{margin:0;font-size:22px;letter-spacing:3px;font-weight:700}
  .brand h1 span{color:var(--accent)}
  .brand .sub{color:var(--muted);font-size:12px;letter-spacing:.5px;margin-top:2px}
  .quote{text-align:right}
  .quote .name{color:var(--muted);font-size:12px}
  .price{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
  .chg{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .warn{color:var(--warn)}

  /* layout */
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-top:16px}
  .main{display:flex;flex-direction:column;gap:16px;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
  .bar.row2{padding-top:0}
  .spacer{flex:1}
  .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px}

  /* buttons and toggles */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
  .seg button{background:transparent;color:var(--muted);border:0;padding:6px 10px;cursor:pointer;font-size:12.5px;font-weight:600}
  .seg button.on{background:var(--accent);color:#06231f}
  .seg.blue button.on{background:#33507a;color:#fff}
  .seg.big button{padding:8px 16px;font-size:13px}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;
    padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:600}
  .btn:hover{border-color:var(--accent)}
  .btn.on{border-color:var(--accent);color:var(--accent)}
  .btn.live.on{color:var(--up);border-color:var(--up)} .btn.live.off{color:#06231f;background:var(--accent);border-color:var(--accent)}
  select,input[type=number],input[type=date]{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:5px 7px;font-size:12.5px;font-weight:600;font-family:inherit}
  input[type=number]{width:74px}
  input[type=date]{color-scheme:dark}
  .hidden{display:none !important}

  /* chart */
  .chartbox{position:relative;padding:6px 6px 0}
  #chart{display:block;width:100%;height:470px;cursor:grab;touch-action:none}
  #chart.dragging{cursor:grabbing}
  .navbox{padding:4px 6px 0}
  #nav{display:block;width:100%;height:56px;cursor:pointer;touch-action:none}
  .rangebar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 14px 10px;font-size:12px}
  .rangebar .hint{color:var(--muted)}
  .badge{position:absolute;top:14px;left:16px;background:#0b1220dd;border:1px solid var(--accent);
    color:var(--accent);font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;display:none;z-index:4}
  .tip{position:absolute;pointer-events:none;background:#0b1220ee;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:12px;line-height:1.5;opacity:0;transition:opacity .08s;white-space:nowrap;z-index:5}
  .replay{border-top:1px solid var(--line);border-bottom:0;background:var(--panel2);border-radius:0 0 10px 10px}
  .replay .readout{font-size:12px;font-variant-numeric:tabular-nums}

  /* side panels, collapsible */
  .side{display:flex;flex-direction:column;gap:14px}
  .side h3{margin:0;padding:11px 13px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);
    font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
  .side h3 .arrow{transition:transform .15s;color:var(--accent);font-size:11px}
  .card .body{border-top:1px solid var(--line)}
  .card.closed .body{display:none}
  .card.closed h3 .arrow{transform:rotate(-90deg)}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
  .cell{background:var(--panel);padding:9px 6px;text-align:center}
  .cell .k{color:var(--muted);font-size:11px;font-weight:700}
  .cell .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .rows{padding:6px 13px 12px}
  .r{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--panel2);font-variant-numeric:tabular-nums}
  .r:last-child{border-bottom:0}
  .r .k{color:var(--muted)} .r .v{font-weight:600;text-align:right}
  .r.head .k{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:700}
  .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px}
  .tag.yes{background:#123b34;color:var(--up)} .tag.no{background:#3b1414;color:var(--down)}
  .note{color:var(--muted);font-size:12px;line-height:1.6;padding:10px 13px 12px}

  /* strategy tester */
  .thead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line)}
  .thead h2{margin:0;font-size:13px;letter-spacing:1.2px;text-transform:uppercase}
  .thead .status{color:var(--muted);font-size:12px}
  .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}
  .step{background:var(--panel);padding:12px 14px;min-width:0}
  .step h4{margin:0 0 8px;font-size:11px;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
  .step .about{color:var(--muted);font-size:12px;line-height:1.5;margin:6px 0 8px}
  .f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;font-size:12.5px}
  .f > span{color:var(--muted)}
  .f .pair{display:flex;gap:6px;align-items:center}
  .f label{display:flex;gap:6px;align-items:center;color:var(--text);cursor:pointer}
  .sub{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
  .sub .lbl{display:block;margin-bottom:4px}

  /* results */
  .banner{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.55}
  .banner b{color:var(--accent);letter-spacing:.5px}
  .tiles{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;background:var(--line)}
  .tile{background:var(--panel);padding:10px 8px}
  .tile .k{color:var(--muted);font-size:11px;font-weight:700}
  .tile .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
  .tile .s{color:var(--muted);font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tabs button{background:transparent;border:1px solid transparent;border-bottom:0;color:var(--muted);padding:7px 12px;
    border-radius:8px 8px 0 0;cursor:pointer;font-weight:600;font-size:12.5px}
  .tabs button.on{background:var(--panel2);color:var(--text);border-color:var(--line)}
  .tabbody{padding:12px 14px 16px;background:var(--panel2);border-radius:0 0 10px 10px}
  .tabbody p{margin:0 0 10px;font-size:12.5px;line-height:1.6;color:var(--muted)}
  .tablewrap{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:8px}
  table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
  th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  td.l,th.l{text-align:left}
  td.why{text-align:left;white-space:normal;min-width:220px;color:var(--muted)}
  tr.click{cursor:pointer} tr.click:hover td{background:#18233a}
  .heat td{text-align:center;font-weight:700}
  .mini{display:block;width:100%;height:180px;margin-top:10px}
  .foot{color:var(--muted);font-size:11px;margin-top:16px;text-align:center;line-height:1.6}

  @media(max-width:1100px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media(max-width:980px){.layout{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}
  @media(max-width:560px){.wrap{padding:12px}#chart{height:380px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
    .price{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <h1>AG<span>O</span>RA</h1>
      <div class="sub" id="sub">MARKET SIMULATOR</div>
    </div>
    <div class="quote">
      <div class="name" id="qname">AGX</div>
      <div class="price" id="price">--</div>
      <div class="chg" id="chg">--</div>
    </div>
  </div>

  <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <div class="seg big" id="sourceSeg">
      <button data-src="sim" class="on">Simulation</button>
      <button data-src="real">Real market</button>
    </div>
    <span class="lbl" id="srcHint"></span>
  </div>

  <div class="layout">
    <div class="main">
      <!-- the chart -->
      <div class="card" id="chartCard">
        <div class="bar" id="bar1"></div>
        <div class="bar row2" id="bar2"></div>
        <div class="chartbox">
          <canvas id="chart"></canvas>
          <div class="badge" id="badge"></div>
          <div class="tip" id="tip"></div>
        </div>
        <div class="navbox"><canvas id="nav" title="The whole history. Drag the box, or click to jump."></canvas></div>
        <div class="rangebar"><span id="rangeInfo"></span>
          <span class="hint">Drag to scroll, wheel to zoom, double click to see it all. Arrow keys and + / - work too.</span></div>
        <div class="bar replay hidden" id="replayBar"></div>
      </div>

      <!-- the strategy tester: step 1, 2, 3 -->
      <div class="card hidden" id="testerCard">
        <div class="thead"><h2>Strategy tester</h2><span class="status" id="tStatus"></span></div>
        <div class="steps" id="steps"></div>
      </div>

      <!-- the results -->
      <div class="card hidden" id="resultsCard">
        <div class="banner" id="banner"></div>
        <div class="tiles" id="tiles"></div>
        <div class="tabs" id="tabs"></div>
        <div class="tabbody" id="tabbody"></div>
      </div>
    </div>

    <div class="side">
      <div class="card" id="cardGrowth"><h3 data-card="cardGrowth">Growth<span class="arrow">&#9660;</span></h3>
        <div class="body"><div class="grid4" id="growth"></div></div></div>
      <div class="card" id="cardStats"><h3 data-card="cardStats"><span id="statsTitle">Details</span><span class="arrow">&#9660;</span></h3>
        <div class="body"><div class="rows" id="stats"></div></div></div>
      <div class="card" id="cardSide3"><h3 data-card="cardSide3"><span id="side3Title">About</span><span class="arrow">&#9660;</span></h3>
        <div class="body"><div class="note" id="side3"></div></div></div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>/*
  THE BACKTEST ENGINE, for the browser.

  This is the same engine as the Python files (indicators.py, strategies.py,
  sizing.py, execution.py, portfolio.py, backtest.py, metrics.py, tester.py),
  written again in JavaScript so the web page can run it. Same names, same steps,
  same order. tests/test_parity.py runs both on the same data and checks that
  they give the same answers, so the page and the research report always agree.

  The one rule that matters most: a bar only reaches the strategy once it has
  closed, and any order it sends is filled at the NEXT bar's open. See the
  comments in backtest.py for the full walk through of one bar.

  Coding done with the help of AI, because coding is not the author's strong area.
*/
(function (root) {
  'use strict';

  // =============================== INDICATORS ===============================
  function sma(values, n) {
    if (n <= 0 || values.length < n) return null;
    let s = 0;
    for (let i = values.length - n; i < values.length; i++) s += values[i];
    return s / n;
  }
  function change(values, n) {
    if (values.length <= n) return null;
    return values[values.length - 1] / values[values.length - 1 - n] - 1;
  }
  function rsi(values, n) {
    if (values.length <= n) return null;
    let ups = 0, downs = 0;
    for (let i = values.length - n; i < values.length; i++) {
      const move = values[i] - values[i - 1];
      if (move > 0) ups += move; else downs -= move;
    }
    if (downs === 0) return 100;
    return 100 - 100 / (1 + ups / downs);
  }
  function highest(values, n, skip) {
    skip = skip || 0;
    if (values.length < n + skip) return null;
    const end = values.length - skip;
    let m = -Infinity;
    for (let i = end - n; i < end; i++) if (values[i] > m) m = values[i];
    return m;
  }
  function lowest(values, n, skip) {
    skip = skip || 0;
    if (values.length < n + skip) return null;
    const end = values.length - skip;
    let m = Infinity;
    for (let i = end - n; i < end; i++) if (values[i] < m) m = values[i];
    return m;
  }
  function atr(h, n) {
    n = n || 14;
    if (h.length <= n) return null;
    const c = h.closes, hi = h.highs, lo = h.lows;
    let total = 0;
    for (let i = c.length - n; i < c.length; i++)
      total += Math.max(hi[i] - lo[i], Math.abs(hi[i] - c[i - 1]), Math.abs(lo[i] - c[i - 1]));
    return total / n;
  }
  const ind = { sma, change, rsi, highest, lowest, atr };

  // =============================== HISTORY (the time frontier) ===============================
  class LookAheadError extends Error {}
  class History {
    constructor(symbol) {
      this.symbol = symbol;
      this.bars = []; this.closes = []; this.highs = []; this.lows = []; this.volumes = [];
    }
    add(bar) {
      if (this.bars.length && bar.d <= this.bars[this.bars.length - 1].d)
        throw new Error('bars must arrive in time order');
      this.bars.push(bar); this.closes.push(bar.c); this.highs.push(bar.h);
      this.lows.push(bar.l); this.volumes.push(bar.v || 0);
    }
    get length() { return this.bars.length; }
    get now() { return this.bars[this.bars.length - 1].d; }
    close(ago) {
      ago = ago || 0;
      if (ago < 0) throw new LookAheadError('asked for a close ' + (-ago) + ' bars in the future');
      return this.closes[this.closes.length - 1 - ago];
    }
  }

  // =============================== STRATEGIES ===============================
  const BUY = (reason) => ({ action: 'BUY', reason: reason || '' });
  const SELL = (reason) => ({ action: 'SELL', reason: reason || '' });
  const HOLD = { action: 'HOLD', reason: '' };
  const pct1 = (x) => (x * 100).toFixed(1) + '%';

  class Strategy {
    constructor(params) {
      this.params = {};
      for (const s of this.constructor.settings) this.params[s[0]] = s[2];
      if (!('stop_loss' in this.params)) this.params.stop_loss = 0;
      if (!('take_profit' in this.params)) this.params.take_profit = this.constructor.defaultTakeProfit || 0;
      Object.assign(this.params, params || {});
    }
    get p() { return this.params; }
    initialize(ctx) {}
    onMarketData(ctx) { this.managePosition(ctx, this.generateSignal(ctx.history)); }
    generateSignal(h) { return HOLD; }
    managePosition(ctx, signal) {
      const held = ctx.position;
      const sl = this.p.stop_loss, tp = this.p.take_profit;
      if (signal.action === 'BUY') {
        if (held < 0) ctx.close(signal.reason);
        if (held <= 0) ctx.buy(signal.reason, sl, tp);
      } else if (signal.action === 'SELL') {
        if (held > 0) ctx.close(signal.reason);
        if (ctx.allowShort && held >= 0) ctx.short(signal.reason, sl, tp);
      }
    }
  }
  Strategy.settings = []; Strategy.grid = {};

  class BuyHold extends Strategy {
    generateSignal(h) { return BUY('buy and hold'); }
  }
  Object.assign(BuyHold, { key: 'bh', label: 'Buy and hold', settings: [], grid: {},
    about: 'Buy on the first bar and never sell. The yardstick every rule has to beat.' });

  class SMACross extends Strategy {
    generateSignal(h) {
      const fast = sma(h.closes, Math.trunc(this.p.fast)), slow = sma(h.closes, Math.trunc(this.p.slow));
      if (fast === null || slow === null) return HOLD;
      if (fast > slow) return BUY('fast average ' + fast.toFixed(2) + ' above slow ' + slow.toFixed(2));
      return SELL('fast average ' + fast.toFixed(2) + ' below slow ' + slow.toFixed(2));
    }
  }
  Object.assign(SMACross, { key: 'sma', label: 'Moving average cross',
    settings: [['fast', 'fast average', 20, 2, 200, 1], ['slow', 'slow average', 50, 5, 400, 5]],
    grid: { fast: [10, 20, 30, 50], slow: [50, 100, 150, 200] },
    about: 'Long while the fast average is above the slow one, out when it drops below.' });

  class RSIReversion extends Strategy {
    generateSignal(h) {
      const v = rsi(h.closes, Math.trunc(this.p.period));
      if (v === null) return HOLD;
      if (v < this.p.low) return BUY('RSI ' + v.toFixed(1) + ' below ' + this.p.low);
      if (v > this.p.high) return SELL('RSI ' + v.toFixed(1) + ' above ' + this.p.high);
      return HOLD;
    }
  }
  Object.assign(RSIReversion, { key: 'rsi', label: 'RSI mean reversion',
    settings: [['period', 'RSI period', 14, 2, 50, 1], ['low', 'buy below', 30, 5, 50, 1], ['high', 'sell above', 70, 50, 95, 1]],
    grid: { period: [7, 14], low: [25, 30, 35], high: [65, 70, 75] },
    about: 'Buy when RSI says oversold, sell when it says overbought.' });

  class Momentum extends Strategy {
    generateSignal(h) {
      const n = Math.trunc(this.p.lookback), move = change(h.closes, n);
      if (move === null) return HOLD;
      if (move > this.p.threshold) return BUY('up ' + pct1(move) + ' over ' + n + ' bars');
      if (move < 0) return SELL('down ' + pct1(move) + ' over ' + n + ' bars');
      return HOLD;
    }
  }
  Object.assign(Momentum, { key: 'mom', label: 'Momentum',
    settings: [['lookback', 'lookback bars', 60, 5, 300, 5], ['threshold', 'buy above', 0.05, 0, 0.5, 0.01]],
    grid: { lookback: [20, 60, 120, 250], threshold: [0.0, 0.05, 0.10] },
    about: 'Buy when the price is up strongly over the lookback, sell when that turns negative.' });

  class MeanReversion extends Strategy {
    generateSignal(h) {
      const avg = sma(h.closes, Math.trunc(this.p.window));
      if (avg === null) return HOLD;
      const price = h.close();
      if (price < avg * (1 - this.p.band)) return BUY('price ' + price.toFixed(2) + ' is ' + pct1(1 - price / avg) + ' below its average');
      if (price >= avg) return SELL('price back to its average ' + avg.toFixed(2));
      return HOLD;
    }
  }
  Object.assign(MeanReversion, { key: 'mr', label: 'Mean reversion',
    settings: [['window', 'average of', 20, 5, 200, 1], ['band', 'buy below by', 0.05, 0.005, 0.3, 0.005]],
    grid: { window: [10, 20, 50], band: [0.03, 0.05, 0.08] },
    about: 'Buy when the price falls well below its average, sell once it gets back.' });

  class Breakout extends Strategy {
    generateSignal(h) {
      const n = Math.trunc(this.p.window), half = Math.max(2, Math.floor(n / 2));
      const top = highest(h.closes, n, 1), bottom = lowest(h.closes, half, 1);
      if (top === null || bottom === null) return HOLD;
      const price = h.close();
      if (price > top) return BUY('new ' + n + ' bar high ' + price.toFixed(2));
      if (price < bottom) return SELL('new ' + half + ' bar low ' + price.toFixed(2));
      return HOLD;
    }
  }
  Object.assign(Breakout, { key: 'brk', label: 'Breakout',
    settings: [['window', 'channel bars', 40, 5, 250, 5]], grid: { window: [20, 40, 60, 100] },
    about: 'Buy a new high of the channel, sell a new low of half the channel.' });

  class BuyTheDip extends Strategy {
    generateSignal(h) {
      const n = Math.trunc(this.p.lookback), peak = highest(h.closes, n);
      if (peak === null) return HOLD;
      const price = h.close();
      if (price <= peak * (1 - this.p.drop)) return BUY(pct1(1 - price / peak) + ' below the ' + n + ' bar peak');
      return HOLD;
    }
  }
  Object.assign(BuyTheDip, { key: 'dip', label: 'Buy the dip', defaultTakeProfit: 0.12,
    settings: [['drop', 'buy after a fall of', 0.10, 0.02, 0.5, 0.01], ['lookback', 'peak over bars', 60, 10, 300, 5]],
    grid: { drop: [0.05, 0.10, 0.15, 0.20], take_profit: [0.10, 0.20, 0.30] },
    about: 'Buy after a fall from the recent peak, and let the take profit (or stop) close it.' });

  const STRATEGIES = [BuyHold, SMACross, RSIReversion, Momentum, MeanReversion, Breakout, BuyTheDip];

  // ================================ THE SERIES AND ITS CANDLE SIZES ================================

  // week, a month, 15 minutes...) picked to suit the zoom, like a real chart.
  function buildSeries(base, interval, kind) {
    const idx = {}; base.forEach((b, i) => { idx[b.d] = i; });
    return {base: base, interval: interval, kind: kind, levels: levelsFor(interval, kind), cache: {}, idx: idx};
  }
  function levelsFor(interval, kind) {
    if (kind === 'sim') return [['1m', {n: 1}], ['5m', {n: 5}], ['15m', {n: 15}], ['30m', {n: 30}], ['1h', {n: 60}]];
    if (interval === '1d') return [['1D', null], ['1W', 'week'], ['1M', 'month'], ['1Q', 'quarter'], ['1Y', 'year']];
    if (interval === '1h') return [['1h', null], ['1D', 'day'], ['1W', 'week']];
    return [['1m', null], ['5m', {m: 5}], ['15m', {m: 15}], ['1h', 'hour'], ['1D', 'day']];
  }
  function mondayOf(d) {
    const t = Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)), day = new Date(t).getUTCDay();
    return new Date(t - ((day + 6) % 7) * 86400000).toISOString().slice(0, 10);
  }
  function groupKey(b, rule, i) {
    if (rule === null) return i;
    if (rule.n) return Math.floor(b.t / rule.n);
    if (rule.m) return b.d.slice(0, 14) + Math.floor(+b.d.slice(14, 16) / rule.m);
    if (rule === 'hour') return b.d.slice(0, 13);
    if (rule === 'day') return b.d.slice(0, 10);
    if (rule === 'week') return mondayOf(b.d.slice(0, 10));
    if (rule === 'month') return b.d.slice(0, 7);
    if (rule === 'quarter') return b.d.slice(0, 4) + 'Q' + Math.floor((+b.d.slice(5, 7) - 1) / 3);
    return b.d.slice(0, 4);
  }
  function groups(li) {
    if (S.cache[li]) return S.cache[li];
    const rule = S.levels[li][1], out = [];
    let cur = null, key = null;
    S.base.forEach((b, i) => {
      const k = groupKey(b, rule, i);
      if (cur && k === key) { cur.i1 = i; if (b.h > cur.h) cur.h = b.h; if (b.l < cur.l) cur.l = b.l; cur.c = b.c; cur.v += b.v || 0;
        cur.liq += b.liq || 0; if (b.halt) cur.halt = 1; }
      else { cur = {i0: i, i1: i, d: b.d, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v || 0, liq: b.liq || 0, halt: b.halt ? 1 : 0}; key = k; out.push(cur); }
    });
    S.cache[li] = out;
    return out;
  }
  function partial(g, last) {                           // a candle that is still forming at the frontier
    const o = {i0: g.i0, i1: last, d: g.d, o: S.base[g.i0].o, h: -Infinity, l: Infinity, c: S.base[last].c, v: 0, liq: 0, halt: 0};
    for (let i = g.i0; i <= last; i++) { const b = S.base[i]; if (b.h > o.h) o.h = b.h; if (b.l < o.l) o.l = b.l; o.v += b.v || 0;
      o.liq += b.liq || 0; if (b.halt) o.halt = 1; }
    return o;
  }
  function avail() {                                     // how many bars exist "now" (the time frontier)
    if (!S) return 0;
    if (source === 'sim') return clamp(Math.floor(nowMin) + 1, 1, S.base.length);
    if (replay.on) return replay.F + 1;
    return S.base.length;
  }
  function pickLevel() {
    if (candlePick !== 'auto') { const i = S.levels.findIndex((l) => l[0] === candlePick); if (i >= 0) return i; }
    const plotW = cv.clientWidth - L - RM, span = V.b - V.a, most = plotW / 4.5;
    for (let li = 0; li < S.levels.length; li++) {
      const per = S.base.length / groups(li).length;
      if (span / per <= most) return li;
    }
    return S.levels.length - 1;
  }
  function visibleGroups(li) {
    const g = groups(li), av = avail(), a = Math.floor(V.a), b = Math.ceil(V.b);
    let lo = 0, hi = g.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (g[m].i1 < a) lo = m + 1; else hi = m; }
    const out = [];
    for (let k = lo; k < g.length && g[k].i0 <= b && g[k].i0 < av; k++) out.push(g[k].i1 >= av ? partial(g[k], av - 1) : g[k]);
    return out;
  }

  // ================================ THE VISIBLE WINDOW (scroll and zoom) ================================
  const L = 10, RM = 66, TOP = 12, B = 24, GAP = 26, MIN_SPAN = 12;
  const padFor = (span) => Math.max(2, span * 0.04);
  function rightEdge() { return avail() - 0.5 + padFor(V.b - V.a); }
  function clampView() {
    const right = rightEdge(), left = -0.5 - padFor(V.b - V.a) * 0.25;
    let span = clamp(V.b - V.a, Math.min(MIN_SPAN, right - left), right - left);
    if (V.b > right) V.b = right;
    V.a = V.b - span;
    if (V.a < left) { V.a = left; V.b = left + span; }
  }
  function isAtRight() { return V.b >= rightEdge() - 0.51; }
  function pinRight() { V.b = avail() - 0.5 + padFor(wantSpan); V.a = V.b - wantSpan; clampView(); }
  function zoomAt(factor, frac) {
    const span = V.b - V.a, anchor = V.a + frac * span, ns = clamp(span * factor, MIN_SPAN, 1e9);
    V.a = anchor - frac * ns; V.b = V.a + ns; clampView(); wantSpan = V.b - V.a; follow = isAtRight(); afterMove();
  }
  function panBy(bars) { V.a += bars; V.b += bars; clampView(); follow = isAtRight(); afterMove(); }
  function showLast(n) { wantSpan = Math.max(MIN_SPAN, n + 2, n / 0.96); follow = true; pinRight(); afterMove(); }
  function fitAll() { const av = avail(); wantSpan = av + padFor(av); V.a = -0.5; V.b = V.a + wantSpan; clampView(); follow = true; afterMove(); }
  function showAround(i, span) { span = span || Math.max(60, V.b - V.a); V.a = i - span / 2; V.b = i + span / 2; clampView();
    wantSpan = V.b - V.a; follow = isAtRight(); afterMove(); }
  function afterMove() { hover = -1; tip.style.opacity = 0; draw(); fillSide(); }

  // ================================ DRAWING THE CHART ================================
  let dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    for (const c of [cv, nv]) { c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); nctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (S) clampView();
    draw();
  }
  const plotW = () => cv.clientWidth - L - RM;
  const xAt = (i) => L + (i - V.a) / (V.b - V.a) * plotW();
  const iAt = (x) => V.a + (x - L) / plotW() * (V.b - V.a);
  function yScale(lo, hi, yT, yB) {
    if (logScale && lo > 0) { const a = Math.log(lo), b = Math.log(hi); return (p) => yT + (yB - yT) * (b - Math.log(p)) / ((b - a) || 1); }
    return (p) => yT + (yB - yT) * (hi - p) / ((hi - lo) || 1);
  }
  function message(msg) {
    const w = cv.clientWidth, h = cv.clientHeight; ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = MUTED; ctx.font = '14px Segoe UI'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(msg, w / 2, h / 2);
    nctx.clearRect(0, 0, nv.clientWidth, nv.clientHeight);
    el('rangeInfo').textContent = '';
  }
  function fmtTime(d, span) {
    if (!d) return '';
    if (source === 'sim') return simClock(S.base[S.idx[d]].t);
    if (d[0] === 'D') return 'day ' + (+d.slice(1));
    const mo = MONTHS[+d.slice(5, 7) - 1], day = +d.slice(8, 10);
    if (d.length > 10) return span > 900 ? day + ' ' + mo : day + ' ' + mo + ' ' + d.slice(11, 16);
    if (span > 500) return mo + ' ' + d.slice(0, 4);
    return day + ' ' + mo + ' ' + d.slice(0, 4);
  }
  const resultShown = () => view === 'tester' && R && R.key === dataKey();

  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!S) { message(loading ? 'Loading ' + (realMeta ? realMeta.name : 'market') + ' …' : loadError); return; }
    ctx.clearRect(0, 0, w, h);
    const li = pickLevel(), G = visibleGroups(li), av = avail();
    const withEq = resultShown();
    const pB = withEq ? TOP + (h - TOP - B - GAP) * 0.64 : h - B, eT = pB + GAP, eB = h - B;
    if (G.length) {
      const pr = drawPrice(G, TOP, pB, w, withEq);
      if (withEq) drawEquity(eT, eB, w);
      xAxis(h - B, w);
      if (hover >= 0) drawHover(G, TOP, withEq ? eB : pB, pr);
    }
    if (replay.on) drawFrontier(TOP, h - B, w);
    drawNav();
    el('candleInfo') && (el('candleInfo').textContent = candlePick === 'auto' ? 'auto, ' + S.levels[li][0] : S.levels[li][0]);
    rangeInfo(li);
    updateHeader();
    fillGrowth();
    const badge = el('badge');
    if (source === 'sim' && !follow) { badge.style.display = 'block'; badge.textContent = '⏸ LOOKING BACK · press Live'; }
    else if (replay.on) { badge.style.display = 'block'; badge.textContent = 'REPLAY · the future is hidden'; }
    else badge.style.display = 'none';
  }

  function drawPrice(G, yT, yB, w, withEq) {
    let lo = Infinity, hi = -Infinity;
    for (const g of G) { if (g.l < lo) lo = g.l; if (g.h > hi) hi = g.h; }
    const padP = (hi - lo) * 0.08 || hi * 0.01; lo = Math.max(logScale ? lo * 0.97 : lo - padP, 1e-9); hi = hi + padP;
    const y = yScale(lo, hi, yT, yB);
    // grid and price labels
    ctx.font = '11px Segoe UI'; ctx.textBaseline = 'middle';
    for (let k = 0; k <= 4; k++) {
      const p = logScale ? Math.exp(Math.log(lo) + (Math.log(hi) - Math.log(lo)) * k / 4) : lo + (hi - lo) * k / 4, yy = y(p);
      ctx.strokeStyle = GRID; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, yy); ctx.lineTo(w - RM, yy); ctx.stroke();
      ctx.fillStyle = MUTED; ctx.textAlign = 'left'; ctx.fillText(money2(p), w - RM + 6, yy);
    }
    ctx.save(); ctx.beginPath(); ctx.rect(L, yT - 2, w - RM - L, yB - yT + 4); ctx.clip();
    if (withEq) shadePeriods(yT, yB);
    // volume, faint along the bottom
    let vmax = 0; for (const g of G) if (g.v > vmax) vmax = g.v;
    const pxPer = plotW() / (V.b - V.a);
    if (vmax > 0) {
      ctx.fillStyle = withAlpha(MUTED, 0.16);
      for (const g of G) { const x0 = xAt(g.i0 - 0.5) + 0.5, x1 = xAt(g.i1 + 0.5) - 0.5, vh = (g.v / vmax) * (yB - yT) * 0.16;
        ctx.fillRect(x0, yB - vh, Math.max(1, x1 - x0), vh); }
    }
    // halts (simulation)
    ctx.fillStyle = 'rgba(150,160,180,0.14)';
    for (const g of G) if (g.halt) ctx.fillRect(xAt(g.i0 - 0.5), yT, Math.max(2, (g.i1 - g.i0 + 1) * pxPer), yB - yT);
    if (mode === 'line') {
      const col = G[G.length - 1].c >= G[0].c ? UP : DOWN, gr = ctx.createLinearGradient(0, yT, 0, yB);
      gr.addColorStop(0, withAlpha(col, 0.22)); gr.addColorStop(1, withAlpha(col, 0));
      const cx = (g) => xAt((g.i0 + g.i1) / 2);
      ctx.beginPath(); G.forEach((g, k) => { k ? ctx.lineTo(cx(g), y(g.c)) : ctx.moveTo(cx(g), y(g.c)); });
      ctx.lineTo(cx(G[G.length - 1]), yB); ctx.lineTo(cx(G[0]), yB); ctx.closePath(); ctx.fillStyle = gr; ctx.fill();
      ctx.lineWidth = 1.7; ctx.lineJoin = 'round';
      for (let k = 1; k < G.length; k++) { ctx.strokeStyle = G[k].c >= G[k - 1].c ? UP : DOWN; ctx.beginPath();
        ctx.moveTo(cx(G[k - 1]), y(G[k - 1].c)); ctx.lineTo(cx(G[k]), y(G[k].c)); ctx.stroke(); }
    } else {
      for (const g of G) {
        const x = xAt((g.i0 + g.i1) / 2), cw = Math.max(1, Math.min(14, (g.i1 - g.i0 + 1) * pxPer * 0.68));
        const col = g.c >= g.o ? UP : DOWN; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, y(g.h)); ctx.lineTo(Math.round(x) + 0.5, y(g.l)); ctx.stroke();
        const yo = y(g.o), yc = y(g.c); ctx.fillRect(x - cw / 2, Math.min(yo, yc), cw, Math.max(1, Math.abs(yc - yo)));
      }
    }
    // forced sales (simulation)
    for (const g of G) { if (!g.liq) continue; const x = xAt((g.i0 + g.i1) / 2); ctx.fillStyle = DOWN; ctx.beginPath();
      ctx.moveTo(x - 4, yT + 1); ctx.lineTo(x + 4, yT + 1); ctx.lineTo(x, yT + 8); ctx.closePath(); ctx.fill(); }
    if (withEq) drawTrades(y);
    ctx.restore();
    // the latest price
    const last = (source === 'sim' && follow) ? simPrice() : S.base[avail() - 1].c;
    if (last >= lo && last <= hi) {
      const ly = y(last), up = last >= G[0].o;
      ctx.strokeStyle = withAlpha(up ? UP : DOWN, 0.5); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(L, ly); ctx.lineTo(w - RM, ly); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = up ? UP : DOWN; ctx.fillRect(w - RM + 1, ly - 9, RM - 2, 18);
      ctx.fillStyle = '#06231f'; ctx.font = 'bold 11px Segoe UI'; ctx.textAlign = 'left'; ctx.fillText(money2(last), w - RM + 6, ly);
    }
    return {y: y, lo: lo, hi: hi};
  }

  function shadePeriods(yT, yB) {                         // what the test covered, and how it was split
    if (!R) return;
    const band = (a, b, col) => { if (a == null || b == null) return; ctx.fillStyle = col; ctx.fillRect(xAt(a - 0.5), yT, xAt(b + 0.5) - xAt(a - 0.5), yB - yT); };
    ctx.fillStyle = 'rgba(8,12,20,0.45)';                 // dim everything outside the test
    ctx.fillRect(L, yT, Math.max(0, xAt(R.period[0] - 0.5) - L), yB - yT);
    const xe = xAt(R.period[1] + 0.5); ctx.fillRect(xe, yT, Math.max(0, cv.clientWidth - RM - xe), yB - yT);
    if (R.train) { band(R.train[0], R.train[1], withAlpha(BENCH, 0.07)); label(R.train[0], yT, 'TRAIN', BENCH); label(R.test[0], yT, 'TEST', ACCENT); }
    if (R.folds) R.folds.forEach((f, k) => { band(f[0], f[1], withAlpha(k % 2 ? ACCENT : BENCH, 0.06)); label(f[0], yT, 'TEST ' + (k + 1), MUTED); });
    // time in the market
    if (R.qty) {
      let run = null;
      const flush = (end) => { if (run) { ctx.fillStyle = withAlpha(run.long ? ACCENT : DOWN, 0.07);
        ctx.fillRect(xAt(run.a - 0.5), yT, xAt(end + 0.5) - xAt(run.a - 0.5), yB - yT); run = null; } };
      for (let k = 0; k < R.qty.length; k++) {
        const q = R.qty[k], i = R.eqIdx[k];
        if (i == null) continue;
        if (q !== 0 && (!run || run.long !== q > 0)) { flush(i - 1); run = {a: i, long: q > 0}; }
        else if (q === 0 && run) flush(i - 1);
      }
      flush(R.eqIdx[R.eqIdx.length - 1]);
    }
  }
  function label(i, yT, text, col) { ctx.fillStyle = col; ctx.font = 'bold 10px Segoe UI'; ctx.textAlign = 'left'; ctx.fillText(text, xAt(i - 0.5) + 4, yT + 10); }

  function drawTrades(y) {
    const av = avail();
    for (const f of R.fills) {
      if (f.bi == null || f.bi >= av || f.bi < V.a - 1 || f.bi > V.b + 1) continue;
      const x = xAt(f.bi), yy = y(f.price), buy = f.side === 'buy';
      ctx.fillStyle = f.purpose === 'stop' ? WARN : f.purpose === 'target' ? BENCH : (buy ? UP : DOWN);
      ctx.beginPath();
      if (buy) { ctx.moveTo(x, yy + 4); ctx.lineTo(x - 5, yy + 12); ctx.lineTo(x + 5, yy + 12); }
      else { ctx.moveTo(x, yy - 4); ctx.lineTo(x - 5, yy - 12); ctx.lineTo(x + 5, yy - 12); }
      ctx.closePath(); ctx.fill();
    }
  }

  function drawEquity(yT, yB, w) {
    const av = avail(), a = V.a - 1, b = V.b + 1;
    // growth since the first bar on screen, so zooming in compares like with like
    const inView = (idx, vals) => { const pts = []; let base = null; for (let k = 0; k < idx.length; k++) { const i = idx[k];
      if (i == null || i >= av || i < a || i > b) continue; if (base === null) base = 1 + vals[k]; pts.push([i, (1 + vals[k]) / base - 1]); } return pts; };
    const lines = [];
    if (R.bench) lines.push({pts: inView(R.eqIdx, R.bench), col: BENCH, w: 1.4, dash: [5, 3]});
    if (R.bh) lines.push({pts: inView(R.bh.idx, R.bh.pct), col: withAlpha(TEXT, 0.45), w: 1.4});
    lines.push({pts: inView(R.eqIdx, R.eqPct), col: ACCENT, w: 2});
    let lo = Infinity, hi = -Infinity;
    for (const ln of lines) for (const p of ln.pts) { if (p[1] < lo) lo = p[1]; if (p[1] > hi) hi = p[1]; }
    if (!isFinite(lo)) { lo = 0; hi = 0; }
    const padE = (hi - lo) * 0.12 || 0.01; lo -= padE; hi += padE;
    const y = yScale(lo, hi, yT, yB);
    ctx.font = '10px Segoe UI'; ctx.textBaseline = 'middle'; ctx.fillStyle = MUTED; ctx.textAlign = 'left';
    for (const p of [hi, lo]) ctx.fillText(pct(p, 0), w - RM + 6, y(p));
    if (lo < 0 && hi > 0) { ctx.strokeStyle = withAlpha(TEXT, 0.25); ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(L, y(0)); ctx.lineTo(w - RM, y(0)); ctx.stroke(); ctx.setLineDash([]); }
    ctx.save(); ctx.beginPath(); ctx.rect(L, yT - 2, w - RM - L, yB - yT + 4); ctx.clip();
    for (const ln of lines) {
      if (!ln.pts.length) continue;
      ctx.strokeStyle = ln.col; ctx.lineWidth = ln.w; ctx.setLineDash(ln.dash || []); ctx.lineJoin = 'round'; ctx.beginPath();
      ln.pts.forEach((p, k) => { k ? ctx.lineTo(xAt(p[0]), y(p[1])) : ctx.moveTo(xAt(p[0]), y(p[1])); });
      ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.restore();
    ctx.fillStyle = MUTED; ctx.textAlign = 'left'; ctx.font = '11px Segoe UI';
    const name = E.BY_KEY[T.strategy].label;
    ctx.fillText(name + ' (teal)' + (R.bh ? ' vs buy and hold (grey)' : '') + (R.bench ? ' vs ' + R.benchName + ' (blue)' : '') + ', growth since the left edge of the screen', L + 2, yT - 9);
  }

  function xAxis(yLine, w) {
    const av = avail(), span = V.b - V.a, n = Math.max(2, Math.floor(plotW() / 120));
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = '11px Segoe UI'; ctx.fillStyle = MUTED;
    let lastLabel = '';
    for (let k = 0; k <= n; k++) {
      const i = Math.round(V.a + span * (k + 0.5) / (n + 1));
      if (i < 0 || i >= av) continue;
      const t = fmtTime(S.base[i].d, span);
      if (t === lastLabel) continue;
      lastLabel = t;
      ctx.fillText(t, xAt(i), yLine + 6);
    }
  }

  function drawFrontier(yT, yB, w) {
    const x = xAt(replay.F + 0.5);
    if (x > w - RM) return;
    ctx.fillStyle = 'rgba(8,12,20,0.55)'; ctx.fillRect(x, yT, w - RM - x, yB - yT);
    ctx.strokeStyle = WARN; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(x, yT); ctx.lineTo(x, yB); ctx.stroke(); ctx.setLineDash([]);
    if (w - RM - x > 90) { ctx.fillStyle = WARN; ctx.font = 'bold 11px Segoe UI'; ctx.textAlign = 'left'; ctx.fillText('future hidden', x + 8, yT + 14); }
  }

  function drawHover(G, yT, yB, pr) {
    const g = G.find((x) => hover >= x.i0 - 0.5 && hover <= x.i1 + 0.5);
    if (!g) { tip.style.opacity = 0; return; }
    const x = xAt((g.i0 + g.i1) / 2);
    ctx.strokeStyle = withAlpha(TEXT, 0.25); ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(x, yT); ctx.lineTo(x, yB); ctx.stroke(); ctx.setLineDash([]);
    const up = g.c >= g.o, first = S.base[g.i0].d, last = S.base[g.i1].d;
    let when = source === 'sim' ? simClock(S.base[g.i0].t) + (g.i1 > g.i0 ? ' to ' + simClock(S.base[g.i1].t) : '') : first + (g.i1 > g.i0 ? ' to ' + last : '');
    let html = '<b>' + when + '</b><br>O ' + money2(g.o) + '  H ' + money2(g.h) + '<br>L ' + money2(g.l) +
      '  <span class="' + (up ? 'up' : 'down') + '">C ' + money2(g.c) + ' (' + pct(g.c / g.o - 1, 2) + ')</span>' + (g.v ? '<br>Vol ' + money0(g.v) : '');
    if (resultShown()) {
      let k = -1; for (let j = 0; j < R.eqIdx.length; j++) if (R.eqIdx[j] != null && R.eqIdx[j] <= g.i1) k = j;
      if (k >= 0) html += '<br><span style="color:' + ACCENT + '">Strategy ' + pct(R.eqPct[k]) + '</span>' +
        (R.qty ? '  holding ' + money0(R.qty[k]) : '');
    }
    tip.innerHTML = html; tip.style.opacity = 1;
  }

  function rangeInfo(li) {
    const av = avail(), a = clamp(Math.ceil(V.a), 0, av - 1), b = clamp(Math.floor(V.b), 0, av - 1);
    const size = {'1D': 'daily', '1W': 'weekly', '1M': 'monthly', '1Q': 'quarterly', '1Y': 'yearly'}[S.levels[li][0]] || S.levels[li][0];
    const unit = S.interval === '1d' && source === 'real' ? ' trading days' : ' bars';
